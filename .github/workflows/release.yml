name: release

on:
  workflow_dispatch:
  # Guarded push trigger lets repository automation publish after a reviewed release PR.
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-pypi]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production releases must run from main; got $GITHUB_REF"
            exit 1
          fi

      - name: Read package version
        id: version
        run: |
          VERSION="$(python -c "import sys; sys.path.insert(0, 'src'); import astscribe; print(astscribe.__version__)")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preparing ASTScribe $VERSION ($TAG)"

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -q "^version: $VERSION$" CITATION.cff
          grep -q "^## \[$VERSION\]" CHANGELOG.md

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; bump astscribe.__version__ before releasing."
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m venv smoke-test
          smoke-test/bin/python -m pip install --no-deps dist/*.whl
          ACTUAL_VERSION="$(smoke-test/bin/python -c "import astscribe; print(astscribe.__version__)")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          smoke-test/bin/python -m astscribe --version

      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  tag:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG_OBJECT_SHA="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" \
              -f message="ASTScribe $VERSION" \
              -f object="$GITHUB_SHA" \
              -f type="commit" \
              --jq .sha
          )"

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_OBJECT_SHA"

  publish:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/astscribe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "ASTScribe $VERSION"

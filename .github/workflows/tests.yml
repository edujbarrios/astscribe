name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/astscribe

  package-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        run: |
          python -m venv smoke-test
          smoke-test/bin/python -m pip install --no-deps dist/*.whl
          smoke-test/bin/python -m astscribe --version

      - name: Enforce sub-1MB wheel
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("astscribe-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one ASTScribe wheel, found {len(wheels)}")

          wheel = wheels[0]
          size = wheel.stat().st_size
          limit = 1_000_000
          print(f"{wheel.name}: {size:,} bytes ({size / 1024:.1f} KiB)")
          if size >= limit:
              raise SystemExit(
                  f"ASTScribe wheel exceeds the {limit:,}-byte project limit: {size:,} bytes"
              )
          PY

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astscribe"
dynamic = ["version"]
description = "Understand unfamiliar ML notebooks with evidence-backed explanations inside Jupyter, without LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Eduardo J. Barrios"}]
keywords = ["ast", "pytorch", "jupyter", "static-analysis", "machine-learning", "scientific-computing", "computer-vision", "vision-language-models", "torchvision", "torchaudio", "audio-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
astscribe = "astscribe.cli:main"

[project.optional-dependencies]
ipython = ["ipython>=8"]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8", "ruff>=0.6", "twine>=5", "ipython>=8"]

[project.urls]
Changelog = "https://github.com/edujbarrios/astscribe/blob/main/CHANGELOG.md"
Documentation = "https://github.com/edujbarrios/astscribe#readme"
Homepage = "https://github.com/edujbarrios/astscribe"
Repository = "https://github.com/edujbarrios/astscribe"
Issues = "https://github.com/edujbarrios/astscribe/issues"

[tool.setuptools.dynamic]
version = {attr = "astscribe.__version__"}

[tool.setuptools.package-data]
astscribe = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
strict = true
allow_redefinition = true
packages = ["astscribe"]

[[tool.mypy.overrides]]
module = "astscribe.ipython.magic"
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
  "astscribe.semantics.peft",
  "astscribe.semantics.pytorch",
  "astscribe.semantics.pytorch_experiment",
  "astscribe.semantics.pytorch_reproducibility",
  "astscribe.semantics.transformers",
]
disable_error_code = ["no-redef"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astscribe"
version = "0.1.0"
description = "Evidence-backed scientific explanations for ML notebooks, without LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Eduardo J. Barrios"}]
keywords = ["ast", "pytorch", "jupyter", "static-analysis", "machine-learning", "scientific-computing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
ipython = ["ipython>=8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "ipython>=8"]

[project.urls]
Repository = "https://github.com/edujbarrios/astscribe"
Issues = "https://github.com/edujbarrios/astscribe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
strict = true
allow_redefinition = true
packages = ["astscribe"]

[[tool.mypy.overrides]]
module = "astscribe.ipython.magic"
disallow_untyped_calls = false
